[build-system]
requires = ["hatchling==1.30.1"]  # hatch-vcs
build-backend = "hatchling.build"

[project]
name = "dbt-osmosis"
version = "1.4.0"
description = "A dbt utility for managing YAML to make developing with dbt more delightful."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "z3z1ma", email = "butler.alex2010@gmail.com" }]
keywords = ["dbt", "yaml", "osmosis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<3.14"

dependencies = [
  "agate>=1.9,<2",
  "click>7,<9",
  "dbt-common>=1,<2",
  "dbt-core>=1.8",
  "dbt-core-interface>=1.1.7",
  "packaging>=24,<26",
  "ruamel.yaml>=0.17,<0.20",
  "rich>=10",
  "pluggy>=1.5.0,<2",
  "PyYAML>=6.0",
  "sqlglot>=28,<31",
  "rapidfuzz>=3.0.0",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
workbench = [
  "pandas>=2.2,<3",
  "streamlit>=1.45.0,<2.0",
  "streamlit-ace~=0.1.1",
  "ydata-profiling>=4.17.0",
  "ipython>=8,<9",
  "feedparser~=6.0.12",
  "streamlit-elements-fluence>=0.1.4",
  "setuptools>=70,<81",
]

openai = ["openai>=1.58.1,<2.42.0"]

azure = ["azure-identity>=1.19,<2"]

duckdb = ["dbt-duckdb>=1,<2"]

proxy = ["mysql-mimic>=2.5.7"]

dev = [
  "basedpyright>=1.38.4,<1.40.0",
  "ruff==0.15.17",
  "pytest>=8.3.4,<9.2.0",
  "pytest-cov~=6.0",
  "hypothesis",
  "mutmut",
  "pre-commit>3.0.0,<5",
  "tomli>=2; python_version < \"3.11\"",
  "dbt-duckdb>=1,<2",
]

[project.scripts]
"dbt-osmosis" = "dbt_osmosis.cli.main:cli"

[tool.uv]
exclude-newer = "7 days"
override-dependencies = ["protobuf>=5.0,<6.0"]

[tool.ruff]
line-length = 100
preview = true

[tool.pyright]
include = ["src/dbt_osmosis/core", "src/dbt_osmosis/cli"]
exclude = [
  "**/_deps/**",
  "**/.venv/**",
  "demo_duckdb/target/**",
  "src/dbt_osmosis/workbench/**",
  "tests/**",
  "src/dbt_osmosis/sql/**",
]
pythonVersion = "3.10"
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = true
reportPrivateImportUsage = false
reportImportCycles = false
reportUnsupportedDunderAll = false

[tool.ty.src]
exclude = [
  "tests/**",
  "src/dbt_osmosis/workbench/**",
  "src/dbt_osmosis/sql/**",
]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.mypy]
python_version = "3.10"
exclude = [
  "^tests/",
  "^src/dbt_osmosis/workbench/",
  "^src/dbt_osmosis/sql/",
]

[[tool.mypy.overrides]]
module = [
  "agate",
  "agate.*",
  "azure",
  "azure.*",
  "dbt_core_interface",
  "dbt_core_interface.*",
  "openai",
  "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
filterwarnings = [
    "default::DeprecationWarning:dbt",
    "default::DeprecationWarning:dbt_osmosis",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if t.TYPE_CHECKING:",
]
fail_under = 70
precision = 2
show_missing = true
skip_covered = false

[tool.deptry]
known_first_party = ["dbt_osmosis"]
optional_dependencies_dev_groups = ["dev"]
package_module_name_map = { "azure-identity" = ["azure"], "dbt-common" = ["dbt_common"], "streamlit-elements-fluence" = ["streamlit_elements_fluence"], "ydata-profiling" = ["ydata_profiling"] }

[tool.deptry.per_rule_ignores]
DEP002 = [
  "streamlit-ace",
  "ipython",
  "setuptools",
  "basedpyright",
  "ruff",
  "pytest",
  "pytest-cov",
  "hypothesis",
  "mutmut",
  "pre-commit",
  "tomli",
]

[dependency-groups]
dev = [
  "basedpyright>=1.38.4,<1.40.0",
  "ruff==0.15.17",
  "pytest>=8.3.4,<9.2.0",
  "pytest-cov~=6.0",
  "hypothesis",
  "mutmut",
  "pre-commit>3.0.0,<5",
  "tomli>=2; python_version < \"3.11\"",
  "dbt-duckdb>=1,<2",
]
